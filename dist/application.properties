# 이 파일은 jar 안의 기본값을 재빌드 없이 덮어쓰는 외부 설정입니다 (dist\application.properties와 동일한 용도).
# jar와 같은 폴더(이 폴더)에 있으면 Spring Boot가 자동으로 읽어서 적용합니다.
# 이 dev 폴더는 로컬(localhost) DB로 테스트하는 용도라 기본값(3000ms)이면 충분하지만,
# 타임아웃 값을 실험해보고 싶을 때 여기서 바로 바꿀 수 있습니다.
dbagent.oracle.connect-timeout-ms=5000

# DB 파일(users.db/metrics.db/dbconfig.db) 위치를 앱 폴더 바로 밑이 아니라 db_config/ 하위로 분리
# (오케스트레이터 요청, 2026-09-21) - main root/AIX dist/dist-aix도 동일하게 db_config/ 하위 사용.
# 풀 크기 3개 전부 10으로 통일 + busy_timeout(오케스트레이터 요청, 2026-09-21).
spring.datasource.url=jdbc:sqlite:db_config/users.db?busy_timeout=5000
dbagent.metrics.datasource.url=jdbc:sqlite:db_config/metrics.db?busy_timeout=5000
dbagent.dbconfig.datasource.url=jdbc:sqlite:db_config/dbconfig.db?busy_timeout=5000

# MySQL/MariaDB/PostgreSQL 커넥션의 소켓 read timeout(ms). 쿼리 실행 중 응답 없는 DB가
# 커넥션을 영구 점유해 풀 전체(기본 max 5)를 고갈시키는 것을 방지.
dbagent.rdb.read-timeout-ms=60000

# 커넥션 풀(HikariCP) 크기 기본값. databases.json의 인스턴스에 pool_min_idle/pool_max_size가
# 있으면 그 값이 우선 적용되고, 없는 인스턴스만 아래 기본값을 사용합니다.
dbagent.oracle.pool.min-idle=2
dbagent.oracle.pool.max-size=10
server.port=8006

# 대시보드 자동 새로고침 주기(ms). app.js가 페이지 로드 시 GET /api/config로 한 번 읽어감.
dbagent.ui.polling-interval-ms=2000

# GET /api/fleet_status의 인스턴스별 상태 조회 하드 타임아웃(초). 이 시간이 지나면 해당 인스턴스는
# down으로 처리하고 넘어가서, 느리거나 응답 없는 DB 하나가 Fleet Overview 화면 전체를 막지 못하게 함.
dbagent.fleet-status.timeout-seconds=15

# Fleet Overview 자동 새로고침 주기(ms). fleet-overview.html이 페이지 로드 시 한 번 읽어감.
# 탭이 실제로 보일 때만 폴링됨(Page Visibility API).
dbagent.fleet-overview.polling-interval-ms=3000

#30일 TTL 세션 정리 파라미터 30일 후에 오래된 세션 자동 삭제
dbagent.auth.session-ttl-days=30

# AI DBA Model 설정
# GPU 서버 방화벽이 REST API 포트(9300, sqlrestapi)만 열어주는 구성으로 확정되면서(2026-09-11)
# Ollama(11434)에는 더 이상 직접 못 붙는다 - 이 값은 이제 sqlrestapi의 베이스 URL이다. 모델명은
# sqlrestapi 쪽(sqltune.llm.model) 설정을 따르므로 여기엔 없다(과거 aidba.ollama.model 제거).
# 2026-09-14: AI 챗봇/Current SQL 분석/SQL 작성기/AI SQL 성능분석이 전부 같은 값을 쓰도록
# aidba.ollama.url + sqltuneadvisor.api.url을 이 프로퍼티 하나로 통합(과거 두 프로퍼티 제거).
# 스킴(http(s)://) 없이 IP:포트만 적어도 자동으로 http://가 붙는다.
# TODO: GPU 서버가 실제로 붙으면 그 주소로 교체할 것 (지금은 로컬에 sqlrestapi가 없어 AI DBA
# 챗봇이 이 값으로는 동작하지 않는다 - SQL Tune Advisor 실험용 컨테이너에만 떠 있는 상태).
aidba.restapi.url=http://localhost:9300